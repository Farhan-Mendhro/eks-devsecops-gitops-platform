apiVersion: v1
kind: ConfigMap
metadata:
  name: synopsis-backend-config
  namespace: synopsis
data:
  PORT: "5000" # Port used by the Express application.
  MONGODB_URI: mongodb://synopsis-mongodb-svc:27017/synopsis # Address of the MongoDB Service.
  REDIS_URL: redis://synopsis-redis-svc:6379 # Address of the Redis Service.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synopsis-backend
  namespace: synopsis
  labels:
    app.kubernetes.io/name: synopsis-backend # Identifies the backend Deployment.
    app.kubernetes.io/part-of: synopsis

spec:
  replicas: 2 # Keep two backend Pods running.
  revisionHistoryLimit: 3 # Keep three previous versions for rollback.

  strategy:
    type: RollingUpdate # Replace backend Pods gradually.
    rollingUpdate:
      maxSurge: 1 # Allow one extra Pod during an update.
      maxUnavailable: 0 # Keep existing available Pods until replacements are ready.

  selector:
    matchLabels:
      app.kubernetes.io/name: synopsis-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: synopsis-backend
        app.kubernetes.io/part-of: synopsis

    spec:
      automountServiceAccountToken: false # Backend doesn't need Kubernetes API access.
      terminationGracePeriodSeconds: 30 # Give the backend 30 seconds to shut down.

      securityContext:
        seccompProfile:
          type: RuntimeDefault # Use standard Linux restrictions.

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # Ask Kubernetes to spread backend Pods across nodes.
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: synopsis-backend # Find other backend Pods.
                topologyKey: kubernetes.io/hostname # Compare worker nodes by their names.

      containers:
        - name: synopsis-backend
          image: docker.io/farhan249/synopsis-backend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000 # Express listens on port 5000.
              protocol: TCP

          envFrom:
            - configMapRef:
                name: synopsis-backend-config # Load ordinary settings such as PORT and database addresses.
            - secretRef:
                name: synopsis-backend-secrets # Load sensitive values such as JWT and OAuth secrets.
                optional: false # Don't start the backend if this Secret is missing.

          resources:
            requests:
              cpu: 250m # Reserve 0.25 CPU for this container.
              memory: 256Mi # Request 256Mi of memory.
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: / # Check whether the backend responds.
              port: http
            periodSeconds: 5 # Check every 5 seconds.
            failureThreshold: 30 # Allow up to 150 seconds for startup.

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3 # Restart the container after 3 failed checks.

          securityContext:
            allowPrivilegeEscalation: false # Don't allow the application to gain extra permissions.
            capabilities:
              drop:
                - ALL # Remove additional Linux permissions the backend doesn't need.

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: synopsis
  labels:
    app.kubernetes.io/name: synopsis-backend

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: synopsis-backend

  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
