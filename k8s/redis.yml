apiVersion: v1
kind: Service
metadata:
  name: synopsis-redis-svc
  namespace: synopsis
spec:
  type: ClusterIP # Give the backend an internal address for Redis.
  selector:
    app.kubernetes.io/name: synopsis-redis # Find the Redis Pod.
  ports:
    - name: redis
      port: 6379 # Redis Service port.
      targetPort: redis # Forward traffic to container port 6379.
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synopsis-redis
  namespace: synopsis
  labels:
    app.kubernetes.io/name: synopsis-redis
    app.kubernetes.io/part-of: synopsis

spec:
  replicas: 1 # Run one Redis cache instance.
  revisionHistoryLimit: 3 # Keep three previous versions.

  strategy:
    type: Recreate # Stop the old Redis Pod before starting its replacement.

  selector:
    matchLabels:
      app.kubernetes.io/name: synopsis-redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: synopsis-redis
        app.kubernetes.io/part-of: synopsis

    spec:
      automountServiceAccountToken: false # Redis doesn't need Kubernetes API access.
      terminationGracePeriodSeconds: 30 # Give Redis time to shut down.

      securityContext:
        runAsNonRoot: true # Don't run Redis as Linux root.
        runAsUser: 999 # Use the redis user inside the image.
        runAsGroup: 999 # Use the redis user's group.
        seccompProfile:
          type: RuntimeDefault # Use the standard Linux restrictions.

      containers:
        - name: redis
          image: redis:8.10.3
          imagePullPolicy: IfNotPresent

          args:
            - redis-server
            - --save
            - "" # Disable database snapshots because Redis is being used only as a cache.
            - --appendonly
            - "no" # Don't save cache data to disk.
            - --maxmemory
            - 160mb # Keep Redis memory below the 256Mi container limit.
            - --maxmemory-policy
            - allkeys-lru # Remove older, less-used keys when Redis memory is full.

          ports:
            - name: redis
              containerPort: 6379 # Redis listens on port 6379.
              protocol: TCP

          resources:
            requests:
              cpu: 100m # Reserve 0.1 CPU for Redis.
              memory: 128Mi # Request 128Mi of memory.
            limits:
              cpu: 500m # Limit CPU usage to 0.5 CPU.
              memory: 256Mi # Limit memory usage to 256Mi.

          startupProbe:
            exec:
              command: ["redis-cli", "ping"] # Ask Redis whether it is responding.
            periodSeconds: 5
            failureThreshold: 10 # Allow up to 50 seconds for startup.

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"] # Check whether Redis can accept requests.
            periodSeconds: 5
            failureThreshold: 12 # Mark Redis not ready after repeated failed checks.
