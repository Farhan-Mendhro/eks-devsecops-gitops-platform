apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synopsis-ingress
  namespace: synopsis
  annotations:
    nginx.org/http-redirect-code: "308"
    nginx.org/proxy-read-timeout: "60s"
    nginx.org/client-max-body-size: "100m"
  labels:
    app.kubernetes.io/name: synopsis
    app.kubernetes.io/part-of: synopsis
spec:
  ingressClassName: nginx # nginx controller (f5)
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: synopsis-frontend-svc
                port:
                  number: 80
