server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to the backend container.
    location /api/ {
        proxy_pass  http://backend:5000;
    }

    # Support React page routes on browser refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}